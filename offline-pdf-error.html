<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>No Internet</title>
    <style>
        body {
            background-color: #0f172a; /* Ekdum saaf suthra dark background */
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }
        .icon {
            font-size: 50px;
            margin-bottom: 20px;
        }
        h2 {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 10px;
        }
        p {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 24px;
        }
        button {
            background-color: #ffffff;
            color: #0f172a;
            border: none;
            padding: 12px 24px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.2s;
        }
        button:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <div class="icon">⚠️</div>
    <h2>Connection Lost</h2>
    <p>Your internet connection is wrong, please try again.</p>
    <button onclick="window.location.reload();">Refresh Page</button>

</body>
</html>
