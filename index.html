<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BSEB Class 11 Commerce</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Top Header -->
    <header class="app-header">
        <div class="header-title">
            <h1>BSEB Class 11 Commerce</h1>
            <p>English & Hindi Medium Books</p>
        </div>
        <div class="header-icon" onclick="openSettings()">⚙️</div>
    </header>

    <!-- Main Content Area -->
    <main class="main-container">
        
        <!-- Auto-Scrolling Banner (Top 5 Books) -->
        <section class="banner-section">
            <div class="banner-slider" id="bannerSlider">
                <!-- Banner items will be injected via JS -->
            </div>
        </section>

        <!-- Medium Filter Tabs -->
        <div class="filter-tabs">
            <button class="filter-btn active" onclick="filterBooks('all')">All Mediums</button>
            <button class="filter-btn" onclick="filterBooks('EN')">English Medium</button>
            <button class="filter-btn" onclick="filterBooks('HI')">Hindi Medium</button>
        </div>

        <!-- Books Grid Section -->
        <section class="books-section">
            <h2>All Textbooks</h2>
            <div class="books-grid" id="booksGrid">
                <!-- Book cards will be injected via JS -->
            </div>
        </section>

    </main>

    <!-- Bottom Navigation Bar -->
    <nav class="bottom-nav">
        <button class="nav-item active" onclick="switchTab('home')">
            <span>🏠</span>
            <p>Home</p>
        </button>
        <button class="nav-item" onclick="switchTab('mybooks')">
            <span>📚</span>
            <p>My Books</p>
        </button>
    </nav>

    <script src="data.js"></script>
    <script src="script.js"></script>
</body>
</html>
