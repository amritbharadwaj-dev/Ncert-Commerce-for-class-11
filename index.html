<!DOCTYPE html>
<html lang="hi" class="light">
<head>
        <script>
        (function() {
            const savedMode = localStorage.getItem('app_theme_mode') || 'light';
            const htmlEl = document.documentElement;
            if (savedMode === 'dark') {
                htmlEl.classList.add('dark');
                htmlEl.classList.remove('light');
            } else if (savedMode === 'light') {
                htmlEl.classList.remove('dark');
                htmlEl.classList.add('light');
            } else if (savedMode === 'auto') {
                if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
                    htmlEl.classList.add('dark');
                    htmlEl.classList.remove('light');
                } else {
                    htmlEl.classList.remove('dark');
                    htmlEl.classList.add('light');
                }
            }
        })();
        </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NCERT Commerce Hub</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
</head>
<body class="bg-white text-slate-900 dark:bg-slate-950 dark:text-slate-100 min-h-screen flex flex-col transition-colors duration-300">

    <!-- Top Header with Search Bar -->
    <header class="bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 sticky top-0 z-40 px-4 py-3 space-y-3 shadow-xs">
        <div class="flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <div class="bg-slate-900 text-white dark:bg-white dark:text-slate-900 p-2 rounded-xl">
                    <i data-lucide="graduation-cap" class="w-5 h-5"></i>
                </div>
                <h1 class="font-bold text-base tracking-wide">Commerce Hub 11</h1>
            </div>
                <!-- Right side container for Support Toggle & Setting Icon -->
    <div class="flex items-center space-x-3">
        <!-- Support Slider Toggle Button -->
        <div class="flex items-center space-x-2">
            <span class="text-xs font-bold text-slate-700 dark:text-slate-300">Support</span>
            <label class="relative inline-flex items-center cursor-pointer">
                <input type="checkbox" id="supportToggleInput" onchange="toggleGlobalSupport()" class="sr-only peer">
                <div class="w-9 h-5 bg-slate-300 peer-focus:outline-none rounded-full peer dark:bg-slate-700 peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all dark:border-slate-600 peer-checked:bg-black dark:peer-checked:bg-white dark:peer-checked:after:bg-black"></div>
            </label>
        </div>
            
       <a href="setting.html" class="ripple-btn bg-slate-100 dark:bg-slate-800 p-2 rounded-xl text-slate-800 dark:text-slate-100 flex items-center justify-center border border-slate-200 dark:border-slate-700">
            <i data-lucide="settings" class="w-5 h-5 text-slate-800 dark:text-slate-100"></i>
        </a>
    </div>
        <!-- Search Bar -->
        <div class="relative w-full">
            <span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-slate-400">
                <i data-lucide="search" class="w-4 h-4"></i>
            </span>
            <input type="text" id="searchInput" oninput="handleSearch(this.value)" placeholder="Search by Book Title, Subject or Author..." class="w-full bg-slate-100 dark:bg-slate-800 text-slate-900 dark:text-slate-100 text-xs rounded-xl pl-9 pr-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-slate-900 dark:focus:ring-white transition">
        </div>
    </header>

    <!-- Main Dynamic Container -->
    <main class="flex-grow max-w-lg mx-auto w-full pb-24">
        
        <!-- HOME SCREEN -->
        <div id="tab-home" class="page-tab px-4 py-4 space-y-6">
            <!-- Large Floating Hero Banner Slider -->
            <div class="relative w-full h-56 rounded-3xl overflow-hidden shadow-lg bg-slate-900 text-white">
                <div id="banner-slider" class="flex transition-transform duration-700 ease-in-out h-full"></div>
                <div class="absolute bottom-3 left-0 right-0 flex justify-center space-x-1.5" id="slider-dots"></div>
            </div>

            <div class="text-left px-1">
                <h3 class="font-extrabold text-lg text-slate-900 dark:text-white">NCERT & Core Books</h3>
                <p class="text-xs text-slate-500 dark:text-slate-400">Explore the best books for your learning journey</p>
            </div>

            <!-- Scrollable Books Grid -->
            <div id="books-grid" class="grid grid-cols-2 gap-4"></div>

            <!-- Footer Signature -->
            <div class="text-center pt-8 pb-4 text-xs font-semibold text-slate-500 dark:text-slate-400">
                <p>Made in ❤️ India • Made for ❤️ India</p>
            </div>
        </div>

        <!-- SAVED BOOKS SCREEN (My Books) -->
        <div id="tab-mybooks" class="page-tab px-4 py-4 space-y-4 hidden">
            <h3 class="font-extrabold text-lg text-slate-900 dark:text-white px-1">My Saved Books</h3>
            <div id="my-books-container" class="grid grid-cols-2 gap-4"></div>
        </div>

        <!-- BOOK DETAIL VIEW -->
        <div id="tab-book-detail" class="page-tab px-4 py-4 hidden space-y-4">
            <button onclick="goBackToHome()" class="ripple-btn flex items-center space-x-1 text-xs font-bold bg-slate-100 dark:bg-slate-800 px-3.5 py-2 rounded-xl w-fit text-slate-900 dark:text-slate-100">
                <i data-lucide="arrow-left" class="w-4 h-4"></i>
                <span>Back</span>
            </button>
            <div id="book-detail-header" class="bg-slate-50 dark:bg-slate-900 p-5 rounded-2xl border border-slate-200 dark:border-slate-800 flex flex-col items-center text-center space-y-3 shadow-xs"></div>
            <div class="space-y-2.5">
                <h4 class="font-extrabold text-xs text-slate-400 uppercase tracking-wider px-1">Chapters List</h4>
                <div id="chapters-list-container" class="space-y-2"></div>
            </div>
        </div>
    </main>

    <!-- Bottom Navigation Bar -->
    <nav class="fixed bottom-0 left-0 right-0 bg-white dark:bg-slate-900 border-t border-slate-200 dark:border-slate-800 py-2.5 px-6 flex justify-around items-center z-40 shadow-xl">
        <button onclick="switchTab('home')" id="nav-home" class="ripple-btn flex flex-col items-center text-slate-900 dark:text-white transition">
            <i data-lucide="home" class="w-5 h-5"></i>
            <span class="text-[10px] font-bold mt-1">Home</span>
        </button>
        <button onclick="switchTab('mybooks')" id="nav-mybooks" class="ripple-btn flex flex-col items-center text-slate-400 dark:text-slate-500 transition">
            <i data-lucide="bookmark" class="w-5 h-5"></i>
            <span class="text-[10px] font-bold mt-1">My Books</span>
        </button>
    </nav>

    <!-- Smooth PDF Loader Modal with Custom Avatar & Progress -->
    <div id="loaderModal" class="fixed inset-0 bg-white dark:bg-slate-950 hidden z-50 flex flex-col items-center justify-center space-y-5 px-6">
        <div class="relative w-24 h-24 bg-slate-100 dark:bg-slate-900 rounded-full flex items-center justify-center shadow-lg animate-bounce border border-slate-200 dark:border-slate-800">
            <!-- Custom Avatar Image -->
            <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150&auto=format&fit=crop&q=80" alt="Avatar" class="w-16 h-16 rounded-full object-cover">
        </div>
        <p id="loaderText" class="text-sm font-bold text-slate-800 dark:text-slate-200 tracking-wide">Opening your chapter...</p>
        <div class="w-52 bg-slate-200 dark:bg-slate-800 h-2 rounded-full overflow-hidden">
            <div class="bg-slate-900 dark:bg-white h-full w-full animate-pulse"></div>
        </div>
    </div>

    <!-- In-App PDF Viewer Modal -->
    <div id="pdfModal" class="fixed inset-0 bg-slate-950 hidden z-50 flex flex-col">
        <div class="bg-white dark:bg-slate-900 px-4 py-3 flex justify-between items-center border-b border-slate-200 dark:border-slate-800">
            <h3 id="pdfModalTitle" class="font-bold text-xs text-slate-900 dark:text-white truncate max-w-[80%]">Chapter PDF</h3>
            <button onclick="closePdfModal()" class="ripple-btn bg-slate-100 dark:bg-slate-800 p-2 rounded-full text-slate-800 dark:text-slate-200">
                <i data-lucide="x" class="w-5 h-5"></i>
            </button>
        </div>
        <div class="flex-grow bg-slate-100 dark:bg-slate-900 relative">
            <iframe id="pdfFrame" src="" class="w-full h-full border-none"></iframe>
        </div>
    </div>

    <!-- Scripts -->
    <script src="global.js"></script>
    <script src="data.js"></script>
    <script src="script.js"></script>
</body>
              </html>
